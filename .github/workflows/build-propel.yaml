name: build-propel

# Build the patched ("propel") Twenty server image (--target twenty, lean) on a
# native amd64 runner and push to the existing public GHCR package. Triggered by
# pushing this branch, or manually.
on:
  push:
    branches: [feat/whatsapp-rls]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: 'lean-v2'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: myi1
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push (--target twenty, linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ghcr.io/myi1/twenty-propel:${{ github.event.inputs.tag || 'lean-v2' }}
          provenance: false
