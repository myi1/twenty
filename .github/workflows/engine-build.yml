name: Build Propel Engine Image

# The "painless build": rebuilds the Propel Twenty fork engine image (the marketing
# heroes etc.) on a free public-repo runner (4-vCPU / 16 GB — enough for the front
# build's 8 GB heap) and pushes it to GHCR. No droplet, no DigitalOcean tier.
# Manual-dispatch only. Builds whatever branch you pass as source_branch.
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Fork branch to build (e.g. build/lean-v3-staging-allheroes)'
        required: true
        default: 'build/lean-v3-staging-allheroes'
      output_tag:
        description: 'GHCR image tag to push'
        required: true
        default: 'lean-v3-allheroes-amd64'
      app_version:
        description: 'APP_VERSION build arg'
        required: false
        default: '0.5.22'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: myi1/twenty-propel

jobs:
  build-and-push:
    # Free public-repo standard runner: 4 vCPU / 16 GB (since 2023-12). The front
    # build runs with --max-old-space-size=8192 and fits comfortably in 16 GB.
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The Dockerfile context + multi-stage build needs headroom; reclaim ~25 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token. Needs the ghcr.io/myi1/twenty-propel package to grant
          # THIS repo write access (Package settings -> Manage Actions access ->
          # add myi1/twenty -> Write). If denied, swap to a PAT secret with
          # write:packages. The source label below keeps the package linked.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # CRITICAL: --target twenty (the lean server+front image). The DEFAULT
          # stage is an s6 all-in-one with bundled postgres that breaks Coolify.
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }}
          labels: org.opencontainers.image.source=https://github.com/myi1/twenty
          build-args: |
            APP_VERSION=${{ github.event.inputs.app_version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Verify pushed image
        run: |
          echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }}"
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }} \
            --format '{{json .Manifest}}' | jq -r '.mediaType, .digest'
