name: Build Propel Engine Image

# Repeatable engine build (no droplet, no DO tier). Free public-repo runners.
# amd64 (default) → prod's Coolify; arm64 → the m4-mini staging stack.
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Fork branch to build (e.g. integ/staging-allheroes-v2)'
        required: true
        default: 'build/lean-v3-staging-allheroes'
      output_tag:
        description: 'GHCR image tag to push'
        required: true
        default: 'lean-v3-allheroes-amd64'
      app_version:
        description: 'APP_VERSION build arg'
        required: false
        default: '0.5.25'
      platform:
        description: 'Target arch: amd64 (prod Coolify) or arm64 (m4 staging)'
        required: false
        default: 'amd64'
      no_cache:
        description: 'Force a full no-cache rebuild (bust a stale frontend layer)'
        required: false
        default: 'false'
      skip_typecheck:
        description: 'EMERGENCY ONLY — skip the twenty-front typecheck gate. Say why in the run notes.'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: myi1/twenty-propel

jobs:
  # ── GATE: typecheck twenty-front before anything is built or pushed ─────────
  # Why this exists: on 2026-08-06 a front-end change reached PRODUCTION that
  # white-screened the sign-in page — anyone without a live session could not
  # reach the login form. The shipped branch already had 2 tsc errors; nothing
  # in this workflow looked. The image build does not typecheck (Vite/esbuild
  # strip types without checking them), so tsc has to run here or not at all.
  #
  # Typecheck is architecture-independent, so this always runs on amd64 even
  # for an arm64 image — no reason to spend arm64 runner time on it.
  typecheck:
    if: github.event.inputs.skip_typecheck != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      # Branches cut before fe8180b711 COMMITTED `node_modules` as a symlink to
      # a developer's local install. Checking one out lays that symlink down, and
      # yarn then dies with `ENOTDIR: not a directory, mkdir .../node_modules`
      # before a single type is checked. Without this the gate cannot run on any
      # historical branch — including the one that shipped the outage it exists
      # to prevent. Only ever removes a NON-directory at that path.
      - name: Clear committed node_modules symlinks
        run: |
          for path in node_modules packages/*/node_modules; do
            if [ -L "${path}" ] || { [ -e "${path}" ] && [ ! -d "${path}" ]; }; then
              echo "removing non-directory ${path} ($(ls -ld "${path}" | awk '{print $1}'))"
              rm -f "${path}"
            fi
          done
          echo "node_modules paths are clear"

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      # twenty-front's types resolve into twenty-shared/twenty-ui .d.ts files.
      # `npm run build` in those packages is ONLY `vite build` and emits NO
      # declarations — the nx target is what produces them. Skip this and tsc
      # reads whatever stale .d.ts happens to be lying around, or none at all.
      - name: Build the packages twenty-front's types resolve into
        run: |
          npx nx build twenty-shared
          npx nx build twenty-ui

      # A broken node_modules makes `npx tsc` exit 0 with NO output, which reads
      # as a clean pass and is the most dangerous failure this gate can have —
      # it would wave through exactly the breakage it exists to catch. So prove
      # the compiler runs BEFORE trusting anything it says about the code.
      - name: Prove the compiler actually runs
        working-directory: packages/twenty-front
        run: |
          VERSION="$(npx tsc --version 2>&1 || true)"
          echo "tsc reports: ${VERSION}"
          case "${VERSION}" in
            Version\ [0-9]*) echo "compiler is present and executable" ;;
            *)
              echo "::error::tsc did not run (got: '${VERSION}'). A silent exit is NOT a pass — refusing to build."
              exit 1
              ;;
          esac

      - name: Typecheck twenty-front
        working-directory: packages/twenty-front
        run: |
          set +e
          OUTPUT="$(npx tsc --noEmit 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "${OUTPUT}"

          if [ "${CODE}" -ne 0 ]; then
            echo "::error::twenty-front failed typecheck (tsc exit ${CODE}). Fix the errors above, or re-dispatch with skip_typecheck=true and a written reason."
            exit 1
          fi

          # Belt and braces: tsc has been known to report errors while still
          # exiting 0 under some configurations. Trust the text too.
          if printf '%s\n' "${OUTPUT}" | grep -q "error TS"; then
            echo "::error::twenty-front reported type errors despite exit 0 — treating as a failure."
            exit 1
          fi

          echo "twenty-front typechecks clean — safe to build the image."

  build-and-push:
    # Never push an image whose front-end has not been typechecked. A skipped
    # gate (skip_typecheck=true) is allowed through deliberately; a FAILED one
    # is not, and neither is a cancelled run.
    needs: typecheck
    if: >-
      !cancelled() &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped')
    # Native runner per arch — both free for public repos (amd64 4c/16GB; arm64 GA).
    runs-on: ${{ github.event.inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      # Make a bypass impossible to miss when someone later asks "was this
      # image checked?" — the answer has to be in the run's own log.
      - name: Record whether the typecheck gate ran
        run: |
          if [ "${{ github.event.inputs.skip_typecheck }}" = "true" ]; then
            echo "::warning::TYPECHECK GATE SKIPPED for this image (${{ github.event.inputs.output_tag }}) — built from ${{ github.event.inputs.source_branch }} WITHOUT a typecheck."
          else
            echo "typecheck gate passed for ${{ github.event.inputs.source_branch }}"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # CRITICAL: --target twenty (lean server+front; NOT the s6 all-in-one default).
          target: twenty
          platforms: linux/${{ github.event.inputs.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }}
          labels: org.opencontainers.image.source=https://github.com/myi1/twenty
          build-args: |
            APP_VERSION=${{ github.event.inputs.app_version }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ github.event.inputs.platform }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ github.event.inputs.platform }},mode=max

      - name: Verify pushed image
        run: |
          echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }} (linux/${{ github.event.inputs.platform }})"
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }} --format '{{json .Manifest}}' | jq -r '.mediaType'
