name: Build Propel Engine Image

# Repeatable engine build (no droplet, no DO tier). Free public-repo runners.
# amd64 (default) → prod's Coolify; arm64 → the m4-mini staging stack.
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Fork branch to build (e.g. integ/staging-allheroes-v2)'
        required: true
        default: 'build/lean-v3-staging-allheroes'
      output_tag:
        description: 'GHCR image tag to push'
        required: true
        default: 'lean-v3-allheroes-amd64'
      app_version:
        description: 'APP_VERSION build arg'
        required: false
        default: '0.5.25'
      platform:
        description: 'Target arch: amd64 (prod Coolify) or arm64 (m4 staging)'
        required: false
        default: 'amd64'
      no_cache:
        description: 'Force a full no-cache rebuild (bust a stale frontend layer)'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: myi1/twenty-propel

jobs:
  build-and-push:
    # Native runner per arch — both free for public repos (amd64 4c/16GB; arm64 GA).
    runs-on: ${{ github.event.inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # CRITICAL: --target twenty (lean server+front; NOT the s6 all-in-one default).
          target: twenty
          platforms: linux/${{ github.event.inputs.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }}
          labels: org.opencontainers.image.source=https://github.com/myi1/twenty
          build-args: |
            APP_VERSION=${{ github.event.inputs.app_version }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ github.event.inputs.platform }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ github.event.inputs.platform }},mode=max

      - name: Verify pushed image
        run: |
          echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }} (linux/${{ github.event.inputs.platform }})"
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.output_tag }} --format '{{json .Manifest}}' | jq -r '.mediaType'
