<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/icons/propel/favicon.svg"
      data-rh="true"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/icons/propel/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/icons/propel/favicon-16.png"
    />
    <link rel="apple-touch-icon" href="/images/icons/ios/180.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#E41D2D" />
    <meta
      name="description"
      content="Propel — the RE/MAX Hub CRM for real estate teams"
    />
    <meta
      property="og:image"
      content="/images/icons/propel/propel-icon.svg"
    />
    <meta
      property="og:description"
      content="Propel — the RE/MAX Hub CRM for real estate teams"
    />
    <meta property="og:title" content="Propel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/images/icons/propel/propel-icon.svg"
    />

    <meta
      name="twitter:description"
      content="Propel — the RE/MAX Hub CRM for real estate teams"
    />
    <meta name="twitter:title" content="Propel" />
    <!-- Self-hosted fonts (was fonts.googleapis.com). External font CDNs are
         blocked by privacy/ad blockers and some networks; when Hanken Grotesk
         failed to load the UI fell back to a system font whose metrics don't
         fit the dense layout, clipping text everywhere (Aliza QA, 2026-09-05).
         Serving from our own origin removes that dependency for every user. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <title>Propel</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <!-- BEGIN: Propel Hero Runtime -->
    <!-- Import map: a runtime-loaded hero's bare imports (built EXTERNAL) resolve to
         the host's re-export shims, which read the host's singletons off
         window.__propelShared (populated by /src/index.tsx → heroShared before the
         tree mounts). Must precede /src/index.tsx so the map is registered before any
         module graph (incl. a hero's dynamic import) is resolved. Keep in sync with
         scripts/gen-hero-shims.mjs (it prints this exact block). -->
    <script type="importmap">
      {
        "imports": {
          "react": "/propel-shims/react.js",
          "react/jsx-runtime": "/propel-shims/react-jsx-runtime.js",
          "react-dom": "/propel-shims/react-dom.js",
          "react-dom/client": "/propel-shims/react-dom-client.js",
          "@mantine/core": "/propel-shims/mantine-core.js",
          "@mantine/hooks": "/propel-shims/mantine-hooks.js",
          "@emotion/react": "/propel-shims/emotion-react.js",
          "@emotion/styled": "/propel-shims/emotion-styled.js",
          "react-router-dom": "/propel-shims/react-router-dom.js",
          "framer-motion": "/propel-shims/framer-motion.js",
          "twenty-ui/display": "/propel-shims/twenty-ui-display.js",
          "twenty-ui/theme-constants": "/propel-shims/twenty-ui-theme-constants.js",
          "@/apollo/utils/getTokenPair": "/propel-shims/at-apollo-utils-getTokenPair.js",
          "@/propel/lib/callPropelRoute": "/propel-shims/at-propel-lib-callPropelRoute.js",
          "@/ui/layout/page/components/PageContainer": "/propel-shims/at-ui-layout-page-components-PageContainer.js",
          "@/ui/layout/page/components/PageHeader": "/propel-shims/at-ui-layout-page-components-PageHeader.js",
          "@/ui/feedback/snack-bar-manager/hooks/useSnackBar": "/propel-shims/at-ui-feedback-snack-bar-manager-hooks-useSnackBar.js",
          "@/dialer-dock/utils/dialerCrmBridge": "/propel-shims/at-dialer-dock-utils-dialerCrmBridge.js",
          "~/config": "/propel-shims/tilde-config.js"
        }
      }
    </script>
    <!-- END: Propel Hero Runtime -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.tertiary (Nocturne warm gray4) */
        --theme-dark-background-tertiary: #211e15;
        /* THEME_LIGHT.background.tertiary (Nocturne warm gray4) */
        --theme-light-background-tertiary: #efe8d9;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-tertiary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-tertiary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
